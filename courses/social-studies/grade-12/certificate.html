<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 12 Completion Certificate</title><link rel="stylesheet" href="styles.css"><style>.cert{max-width:1000px;margin:5vh auto;border:11px double #b68a3a;background:#fffaf0;color:#17202b;padding:55px;text-align:center}.cert h1{font-size:clamp(2rem,5vw,4rem)}.sig{display:grid;grid-template-columns:1fr 1fr;gap:55px;margin-top:70px}.line{border-top:1px solid #17202b;padding-top:7px}@media print{body{background:white}.noPrint{display:none}}</style></head><body><main id="out"></main><script>
const KEY="khaemenes_grade12_global_politics_v1";let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){};const requested=new URLSearchParams(location.search).get("student");const s=db?.students?.find(x=>x.teacher?.issued&&(x.name===requested||!requested))||db?.students?.find(x=>x.id===db.activeId&&x.teacher?.issued);const out=document.getElementById("out");
if(!s){out.innerHTML='<section class="card" style="max-width:800px;margin:10vh auto"><h1>Certificate Not Available</h1><p>Final credit has not been issued by the evaluator in this browser record.</p><a class="button" href="index.html">Return to Course</a></section>'}
else{out.innerHTML=`<section class="cert"><div>KHAEMENES HIGH</div><h1>Certificate of Completion</h1><p>This certifies that</p><h2>${s.name}</h2><p>has completed the enforced 36-week requirements for</p><h2>Global Politics, International Relations &amp; Senior Research Honors</h2><p>Course KHAE-SS12-GPIR · 1.0 Honors Credit</p><p>including comparative politics, international relations, international law, global challenges, 150 documented hours, weekly mastery, major performance assessments, a 4,000–5,000-word senior thesis, oral defense, cumulative final examination, integrity verification, and evaluator approval.</p><p><strong>Credit issued:</strong> ${s.teacher.issuedDate||'Recorded in evaluator portal'}</p><div class="sig"><div class="line">Teacher / Homeschool Evaluator</div><div class="line">Date</div></div><p style="margin-top:50px">Jennifer Pearl and Autumn Pearl · Khaemenes Academy · 2026</p><button class="noPrint" onclick="window.print()">Print Certificate</button></section>`}
</script></body></html>
